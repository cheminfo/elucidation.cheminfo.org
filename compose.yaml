# Port-published deployment, used for local runs of the full stack.
# The frontend is published on PORT and proxies nothing: point the API endpoint in the
# app's settings at http://localhost:8000, or put both behind a reverse proxy.
services:
  frontend:
    image: ghcr.io/cheminfo/elucidation-frontend:latest
    build: .
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 0.25
    pids_limit: 256
    ports:
      - '${PORT:-10718}:80'

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    init: true
    security_opt:
      - no-new-privileges:true
    # Deliberately not capability-hardened, unlike the other services. Its entrypoint
    # runs as root to chown /data and then drops to the redis user, which needs
    # SETUID/SETGID/CHOWN *and* DAC_READ_SEARCH: the appendonlydir it created earlier is
    # mode 0700 owned by redis, and a root without DAC_READ_SEARCH cannot even traverse
    # it, so the entrypoint's `find` fails and takes the container down with it. Dropping
    # capabilities here cost two production outages; the caps that would be needed to
    # keep it working are broad enough that dropping them buys very little.
    ulimits:
      core: 0
    restart: unless-stopped
    mem_limit: 1g
    cpus: 0.25
    pids_limit: 256
    volumes:
      - ./data/redis:/data

  api:
    image: adrianmirza/elucidation:latest
    depends_on:
      - vectordb
      - forward_synthesis
      - redis
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 4g
    cpus: 1
    pids_limit: 512
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - '8000:8000'
    volumes:
      - ./cache:/app/cache

  worker:
    image: adrianmirza/celery
    # One slot, deliberately: this deployment is tuned for the latency of a single run and
    # everything else waits its turn. Concurrent runs share the same two sidecars and the
    # GA blocks on them every generation, so slots past the first only made each run
    # slower without raising throughput.
    #
    # prefetch-multiplier=1 leaves a queued job on the broker instead of reserving it
    # here, so /queue/stats reports the number of jobs actually waiting.
    command: celery -A celery_config.celery_app worker -l info -Q spectrum_queue --concurrency=1 --prefetch-multiplier=1
    depends_on:
      - redis
      - api
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 16g
    cpus: 8
    pids_limit: 1024
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # The one task owns the container, so it gets the whole quota. Pinned to 1 thread it
      # ran the GA's in-process work — scoring, RDKit, the encoder pass — on a single core
      # with the rest idle, and that work sits on the critical path of every generation.
      - OMP_NUM_THREADS=8
      - MKL_NUM_THREADS=8
      - OPENBLAS_NUM_THREADS=8
    volumes:
      - ./cache:/app/cache

  # No cap_drop or read_only: opaque third-party images with undocumented requirements.
  vectordb:
    image: adrianmirza/retrieval
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 64g
    cpus: 8
    pids_limit: 1024
    environment:
      # cpus is a CFS quota, not an affinity mask: the container still sees all 20 host
      # cores, so torch/OpenMP/BLAS size their pools to 20 and then spin at barriers
      # inside a much smaller quota. Pin the pools to the quota instead.
      #
      # worker + vectordb + forward_synthesis now sum to 24 quota on a 20-core host. That
      # is deliberate: with a single job in flight the three run in turn, never at once,
      # and a quota is a ceiling rather than a reservation.
      - OMP_NUM_THREADS=8
      - MKL_NUM_THREADS=8
      - OPENBLAS_NUM_THREADS=8
    volumes:
      - ./pubchem_vector_db_hnsw_pqm_16_ef_256_m_32:/pubchem_vector_db_hnsw_pq.index

  forward_synthesis:
    image: adrianmirza/forward_synthesis
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 8g
    cpus: 8
    pids_limit: 512
    environment:
      # Same reasoning as vectordb: pin the pools to the quota, and let the quotas overlap
      # because only one of the three compute services is active at any moment.
      # This one is called once per candidate, so it is the service a larger offspring_ga
      # buys time from.
      - OMP_NUM_THREADS=8
      - MKL_NUM_THREADS=8
      - OPENBLAS_NUM_THREADS=8
