<!doctype html>
<html lang="en">
  <head>
    <!-- Where this deployment is mounted. The build itself carries no mount —
         its assets are relative — so this is what resolves them, and what the
         page reads its own mount back off. A deployment serving the site under
         a path rewrites it, which is how one build serves this site's own host
         and a path of a shared one. It has to come before anything it
         resolves. -->
    <base href="/" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The same geometry `react-cheminfo`'s `SiteMark` draws for this site,
         written out with literal colours because a file served on its own
         cannot read the page's custom properties. Change one and change the
         other. -->
    <link rel="icon" href="./favicon.svg" />
    <meta name="theme-color" content="#7e22ce" />
    <!--cheminfo:head-->
  </head>
  <body class="bp6-body">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <!--cheminfo:body-->
  </body>
</html>
